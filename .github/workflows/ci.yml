name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test
      ENABLE_DEV_SEED: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit All Dependencies (Unpatched Advisory Review)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true

          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!Number.isInteger(audit.auditReportVersion) ||
              !audit.metadata ||
              !audit.vulnerabilities ||
              typeof audit.vulnerabilities !== 'object' ||
              audit.error) {
            console.error('npm audit did not return a complete, valid audit report; refusing to treat this as a clean dependency scan.');
            process.exit(1);
          }
          const entries = Object.entries(audit.vulnerabilities);
          const expectedAdvisory = 'https://github.com/advisories/GHSA-vfj7-8cjw-p6xm';
          const braces = lock.packages?.['node_modules/braces'];
          const eslintConfig = lock.packages?.['node_modules/eslint-config-next'];

          const reviewedDevOnlyChain = {
            'braces': { parent: null, direct: false },
            'micromatch': { parent: 'braces', direct: false },
            'fast-glob': { parent: 'micromatch', direct: false },
            '@next/eslint-plugin-next': { parent: 'fast-glob', direct: false },
            'eslint-config-next': { parent: '@next/eslint-plugin-next', direct: true },
          };

          function allowUnpatchedDevOnlyBraces(name, vulnerability) {
            const expected = reviewedDevOnlyChain[name];
            const lockPackage = lock.packages?.[`node_modules/${name}`];
            if (!expected || !lockPackage || lockPackage.dev !== true) return false;

            const via = vulnerability.via || [];
            const advisoryEntries = via.filter((entry) =>
              entry && typeof entry === 'object' && typeof entry.url === 'string'
            );
            const dependencyEntries = via.filter((entry) => typeof entry === 'string');
            const exactAdvisory = name === 'braces'
              ? advisoryEntries.length === 1 &&
                advisoryEntries[0].url === expectedAdvisory &&
                dependencyEntries.length === 0
              : advisoryEntries.length === 0 &&
                dependencyEntries.length === 1 &&
                dependencyEntries[0] === expected.parent;

            const expectedNode = `node_modules/${name}`;
            const nodesMatch = Array.isArray(vulnerability.nodes) &&
              vulnerability.nodes.length > 0 &&
              vulnerability.nodes.every((node) => node === expectedNode);
            const onlyBreakingDowngrade = vulnerability.fixAvailable &&
              typeof vulnerability.fixAvailable === 'object' &&
              vulnerability.fixAvailable.name === 'eslint-config-next' &&
              vulnerability.fixAvailable.version === '14.2.35' &&
              vulnerability.fixAvailable.isSemVerMajor === true;

            return vulnerability.severity === 'high' &&
              vulnerability.isDirect === expected.direct &&
              nodesMatch &&
              exactAdvisory &&
              onlyBreakingDowngrade;
          }

          const reviewedMinimatchDevChain = {
            '@eslint-community/eslint-utils': {
              direct: false,
              via: ['eslint'],
              nodes: [
                'node_modules/@eslint-community/eslint-utils',
                'node_modules/@next/eslint-plugin-next/node_modules/@eslint-community/eslint-utils',
              ],
              fix: { name: 'eslint', version: '4.0.0' },
            },
            '@eslint/config-array': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/@eslint/config-array'],
              fix: { name: 'eslint', version: '4.0.0' },
            },
            '@eslint/eslintrc': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/@eslint/eslintrc'],
              fix: { name: 'eslint', version: '4.0.0' },
            },
            '@next/eslint-plugin-next': {
              direct: false, via: ['@eslint-community/eslint-utils'], nodes: ['node_modules/@next/eslint-plugin-next'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            '@typescript-eslint/eslint-plugin': {
              direct: false, via: ['@typescript-eslint/parser', '@typescript-eslint/type-utils', '@typescript-eslint/utils', 'eslint'],
              nodes: ['node_modules/@typescript-eslint/eslint-plugin'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            '@typescript-eslint/parser': {
              direct: false, via: ['@typescript-eslint/typescript-estree', 'eslint'],
              nodes: ['node_modules/@typescript-eslint/parser'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            '@typescript-eslint/type-utils': {
              direct: false, via: ['@typescript-eslint/typescript-estree', '@typescript-eslint/utils', 'eslint'],
              nodes: ['node_modules/@typescript-eslint/type-utils'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            '@typescript-eslint/typescript-estree': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/@typescript-eslint/typescript-estree'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            '@typescript-eslint/utils': {
              direct: false, via: ['@eslint-community/eslint-utils', '@typescript-eslint/typescript-estree', 'eslint'],
              nodes: ['node_modules/@typescript-eslint/utils'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            'eslint': {
              direct: true, via: ['@eslint-community/eslint-utils', '@eslint/config-array', '@eslint/eslintrc', 'minimatch'],
              nodes: ['node_modules/eslint'], fix: { name: 'eslint', version: '4.0.0' },
            },
            'eslint-config-next': {
              direct: true,
              via: ['@next/eslint-plugin-next', 'eslint', 'eslint-plugin-import', 'eslint-plugin-jsx-a11y', 'eslint-plugin-react', 'typescript-eslint'],
              nodes: ['node_modules/eslint-config-next'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            'eslint-plugin-import': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/eslint-plugin-import'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            'eslint-plugin-jsx-a11y': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/eslint-plugin-jsx-a11y'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            'eslint-plugin-react': {
              direct: false, via: ['minimatch'], nodes: ['node_modules/eslint-plugin-react'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
            'minimatch': {
              direct: false, via: [],
              nodes: [
                'node_modules/minimatch',
                'node_modules/@typescript-eslint/typescript-estree/node_modules/minimatch',
              ],
              fix: { name: 'eslint', version: '4.0.0' },
              advisory: 'https://github.com/advisories/GHSA-g3hv-75wg-m249',
            },
            'typescript-eslint': {
              direct: false,
              via: ['@typescript-eslint/eslint-plugin', '@typescript-eslint/parser', '@typescript-eslint/typescript-estree', '@typescript-eslint/utils', 'eslint'],
              nodes: ['node_modules/typescript-eslint'],
              fix: { name: 'eslint-config-next', version: '0.2.4' },
            },
          };

          function sameStringSet(actual, expected) {
            if (!Array.isArray(actual) || actual.length !== expected.length) return false;
            const left = [...actual].sort();
            const right = [...expected].sort();
            return left.every((value, index) => value === right[index]);
          }

          function allowReviewedDevOnlyMinimatch(name, vulnerability) {
            const expected = reviewedMinimatchDevChain[name];
            if (!expected || vulnerability.severity !== 'moderate' ||
                vulnerability.isDirect !== expected.direct ||
                !sameStringSet(vulnerability.nodes, expected.nodes) ||
                !sameStringSet((vulnerability.via || []).filter((entry) => typeof entry === 'string'), expected.via)) {
              return false;
            }

            // Every concrete installed copy must remain dev-only. A production
            // resolution or a newly nested dependency path invalidates this review.
            if (!expected.nodes.every((node) => lock.packages?.[node]?.dev === true)) return false;

            const advisoryEntries = (vulnerability.via || []).filter((entry) =>
              entry && typeof entry === 'object' && typeof entry.url === 'string'
            );
            if (expected.advisory) {
              if (advisoryEntries.length !== 1 ||
                  advisoryEntries[0].url !== expected.advisory ||
                  advisoryEntries[0].range !== '<11.0.1') return false;
            } else if (advisoryEntries.length !== 0) {
              return false;
            }

            const fix = vulnerability.fixAvailable;
            return Boolean(fix && typeof fix === 'object' &&
              fix.name === expected.fix.name &&
              fix.version === expected.fix.version &&
              fix.isSemVerMajor === true);
          }

          const unapproved = entries.filter(([name, vulnerability]) =>
            !allowUnpatchedDevOnlyBraces(name, vulnerability) &&
            !allowReviewedDevOnlyMinimatch(name, vulnerability)
          );

          if (unapproved.length > 0) {
            console.error('Full dependency audit found vulnerabilities outside the reviewed dev-only exception:');
            for (const [name, vulnerability] of unapproved) {
              console.error(JSON.stringify({
                name,
                severity: vulnerability.severity,
                isDirect: vulnerability.isDirect,
                nodes: vulnerability.nodes,
                fixAvailable: vulnerability.fixAvailable,
                via: vulnerability.via,
                advisories: (vulnerability.via || []).filter((entry) => entry && typeof entry === 'object')
                  .map((entry) => ({ title: entry.title, url: entry.url, range: entry.range })),
              }));
            }
            process.exit(1);
          }

          if (entries.length === 0) {
            console.log('Full dependency audit: no reported vulnerabilities.');
          } else {
            console.warn('REVIEWED EXCEPTIONS: (1) GHSA-vfj7-8cjw-p6xm in the exact dev-only braces → micromatch → fast-glob → @next/eslint-plugin-next → eslint-config-next chain; npm proposes only a breaking major downgrade. (2) GHSA-g3hv-75wg-m249 in the exact dev-only minimatch/ESLint/TypeScript-ESLint dependency graph; every affected lockfile node is dev:true and npm proposes only breaking downgrades to ESLint 4.0.0 or eslint-config-next 0.2.4. Production dependencies are separately gated by npm audit --omit=dev. Recheck exact nodes, paths, severities, fixes, and advisory ranges whenever the lockfile or upstream packages change.');
          }
          NODE

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test

      - name: Run Production Build
        run: npm run build
        env:
          NODE_ENV: production
          ENABLE_DEV_SEED: "false"
